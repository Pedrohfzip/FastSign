version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastsign-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=fastsign
      - DB_USER=postgres
      - DB_PASSWORD=123
      - RESEND_API_KEY=re_cCYxukC7_1fHixGH35dhzHU1dvSS2XCFb
      - EMAIL_FROM=FastSign <onboarding@resend.dev>
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/storage:/app/storage
    depends_on:
      - db
    networks:
      - fastsign-network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fastsign-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - fastsign-network
  db:
    image: postgres:15-alpine
    container_name: fastsign-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=fastsign
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fastsign-network

  ollama:
    image: ollama/ollama:latest
    container_name: fastsign-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - fastsign-network
volumes:
  postgres_data:
  ollama_data:

networks:
  fastsign-network:
    driver: bridge
