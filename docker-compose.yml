services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sinaki-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=sinaki
      - DB_USER=postgres
      - DB_PASSWORD=123
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/storage:/app/storage
    depends_on:
      - db
    networks:
      - sinaki-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sinaki-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - sinaki-network

  db:
    image: pgvector/pgvector:pg15
    container_name: sinaki-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sinaki
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sinaki-network

  ollama:
    image: ollama/ollama:latest
    container_name: sinaki-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - sinaki-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

volumes:
  postgres_data:
  ollama_data:

networks:
  sinaki-network:
    driver: bridge
