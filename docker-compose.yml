services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastsign-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=fastsign
      - DB_USER=postgres
      - DB_PASSWORD=TROQUE_POR_UMA_SENHA_FORTE
    env_file:
      - ./backend/.env.production
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - db
    networks:
      - fastsign-network

  db:
    image: postgres:15-alpine
    container_name: fastsign-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=fastsign
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=TROQUE_POR_UMA_SENHA_FORTE
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fastsign-network

volumes:
  postgres_data:

networks:
  fastsign-network:
    driver: bridge