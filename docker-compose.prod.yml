services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: sinaki-frontend-build
    env_file:
      - ./frontend/.env.production
    volumes:
      - ./frontend/dist:/app/dist

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sinaki-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=sinaki
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    env_file:
      - ./backend/.env.production
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - db
    networks:
      - sinaki-network

  db:
    image: pgvector/pgvector:pg15
    container_name: sinaki-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sinaki
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sinaki-network

volumes:
  postgres_data:

networks:
  sinaki-network:
    driver: bridge
