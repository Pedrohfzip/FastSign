version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastsign-backend
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=fastsign
      - DB_USER=postgres
      - DB_PASS=123
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db
    networks:
      - fastsign-network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fastsign-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - fastsign-network
  db:
    image: postgres:15-alpine
    container_name: fastsign-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=fastsign
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fastsign-network

volumes:
  postgres_data:

networks:
  fastsign-network:
    driver: bridge