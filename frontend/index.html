<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Rotas de assinatura (/assinar/:accessToken, /sign/:accessToken) carregam um
         token de posse na própria URL — sem isso, navegar a partir dessas páginas pra
         qualquer link/recurso de terceiro vazaria a URL inteira (token incluído) no
         cabeçalho Referer. `no-referrer` nunca envia Referer em nenhuma navegação/
         requisição saindo do app, mais estrito que o padrão do navegador
         (`strict-origin-when-cross-origin`) — aplicado ao app inteiro (é uma SPA de
         rota única) já que nenhuma tela depende de o destino receber esse cabeçalho. -->
    <meta name="referrer" content="no-referrer" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
